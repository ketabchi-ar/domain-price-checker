name: Daily Auto-Update Domain Prices

on:
  schedule:
    # Runs everyday at 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run price scraper
        run: |
          python update_prices.py

      - name: Commit and push if prices changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tlds.json tlds.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update domain prices from IranServer [skip ci]" && git push)
